spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splitmate}
    username: ${SPRING_DATASOURCE_USERNAME:splitmate}
    password: ${SPRING_DATASOURCE_PASSWORD:splitmate}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
